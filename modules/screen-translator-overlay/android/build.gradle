plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.screentranslator'
version = '1.0.0'

android {
  namespace "expo.modules.screentranslator"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"

  // Google ML Kit on-device Text Recognition (Supports Japanese, Chinese, Korean, Latin)
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "com.google.mlkit:text-recognition-japanese:16.0.1"
  implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
  implementation "com.google.mlkit:text-recognition-korean:16.0.1"

  // Google ML Kit on-device Translation (Supports Japanese, Chinese, English, Korean, etc.)
  implementation "com.google.mlkit:translate:17.0.3"

  // ONNX Runtime for on-device Comic Text & Speech Bubble Detection
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.19.2"
}



